      if (e.key !== 'Escape') { x2Tasto = e.key === 'Backspace' ? '' : String(e.key || '').toLowerCase(); try { localStorage.setItem('grypho_tasto_x2', x2Tasto); } catch (er) {} }
      x2Etichetta(); return;
    }
    if (x2Tasto && String(e.key || '').toLowerCase() === x2Tasto) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (!e.repeat && x2Prima === null) { x2Prima = Number(vEl.playbackRate) || 1; vEl.playbackRate = 2; velAgg(2); }
      return;
    }
    if (fsAperto) { if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); fsPasso(1); return; } if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); fsPasso(-1); return; } if (e.key === 'Escape') { e.preventDefault(); fsChiudi(); return; } }
    var sk = salti(), mv = { ArrowLeft: -sk.lr, ArrowRight: sk.lr, ArrowUp: sk.ud, ArrowDown: -sk.ud };
    if (mv[e.key] !== undefined) { e.preventDefault(); e.stopPropagation(); vai(vEl.currentTime + mv[e.key]); return; }
    if (tg === 'VIDEO' && e.key === ' ') return;
    if (e.key === ' ') { e.preventDefault(); vEl.paused ? vEl.play() : vEl.pause(); return; }
    if (an) return;
    if (e.key === 'Tab' || e.key === '<' || e.key === '>') { e.preventDefault(); scambiaBoard(); return; }
    var k = String(e.key || '').toLowerCase(); if (k.length !== 1) return;

  /* numero di maglia: si digita su tastiera (anche due cifre) e scatta il giocatore nostro con quel numero */

    numBuf += c;
    var cand = tutti.filter(function (x) { return x.mg.indexOf(numBuf) === 0; });
    if (!cand.length) { numBuf = c; cand = tutti.filter(function (x) { return x.mg.indexOf(numBuf) === 0; }); if (!cand.length) { numBuf = ''; return; } }
    function scatta() {

  function apriHelp() {
    var m = $('modal'); m.classList.remove('hid');
    m.innerHTML = '<div style="position:relative;max-width:760px"><button class="b" id="hX" aria-label="Chiudi" style="position:absolute;right:0;top:0;min-height:36px;padding:4px 12px">&#10005;</button><h2>Istruzioni</h2><div class="hlp">\n' +
      '<p>Il tagging fa parte di <b>Grypho App</b>, l\'applicazione creata da <b>Tagup&trade;</b> (<a href="https://tagup.it/" target="_blank" rel="noopener" style="color:inherit">tagup.it</a>) per la società ' + (typeof UNDER !== 'undefined' && UNDER ? 'Perugia Basket' : 'Grypho Basket Perugia') + '.</p>\n' +
      '<h3>Partite</h3>\n' +
      '<p>In Partite scegli la serie (C o B) e trovi l\'elenco delle partite taggate, con chi ci ha lavorato e quando. Con Nuova partita scegli la serie (B o C; per gli Under la partita si carica dall\'elenco del gruppo, vedi Tagging Under), la Squadra A e la Squadra B (la prima è quella di casa), la giornata e la data. Se la partita è nel calendario, giornata e data si compilano da sole. Il titolo si scrive in automatico e lo puoi correggere. Modifica partita apre la stessa finestra, già compilata.</p>\n' +
      '<p>Elimina sposta la partita nel Cestino, dopo una conferma: resta 14 giorni e puoi ripristinarla. Passati i 14 giorni viene cancellata per sempre, insieme ai suoi tag. Con Elimina ora la cancelli subito.</p>\n' +
      '<h3>Il video</h3>\n' +
      '<p>Scegli video propone le partite già caricate su Drive e ti lascia aprire un file mp4 dal tuo computer, incollare il link di YouTube o Facebook, oppure caricare un video nuovo dall\'app: va su Drive e anche nella playlist YouTube. Se il browser lo permette, ricorda l\'ultimo file di ogni partita e basta premere Riapri l\'ultimo. Finestra porta il video fuori dalla pagina, in una finestra che puoi ingrandire, rimpicciolire e spostare anche su un altro schermo. I pulsanti con il meno e il più cambiano la grandezza del video nella pagina. Puoi anche taggare una diretta da YouTube o Facebook, indicando le due squadre e la giornata.</p>\n' +
      '<h3>Tagliare una clip</h3>\n' +
      '<p>Durante il video premi un pulsante di categoria, oppure il tasto che gli è stato assegnato. Ogni pulsante (categorie, descrittori e giocatori) ha una scorciatoia automatica, che puoi cambiare nelle sue impostazioni. Per i nostri giocatori la scorciatoia è il numero di maglia: digiti 7, oppure 1 e 0 di seguito per il 10. I numeri sono riservati alle maglie, i pulsanti usano le lettere.</p>\n' +
      '<p>L\'icona con la freccia Maiusc, nella riga dei pulsanti, mostra il tasto tra parentesi vicino al nome di ogni pulsante: toccala per tenerli visibili, oppure tieni premuto Maiusc per vederli solo finché lo premi.</p>\n' +
      '<p>Il tag si crea al minuto in cui sei, con i secondi prima e dopo decisi per quel pulsante. Subito dopo, con il tag selezionato, premi i descrittori e i giocatori da collegare. Un descrittore o un giocatore premuto una seconda volta si toglie. Dal tag selezionato puoi riguardare la clip, allungarla o accorciarla, scrivere una nota o eliminarla.</p>\n' +
      '<h3>Due tipi di pulsante</h3>\n' +
      '<p>La categoria crea un tag nuovo, per esempio 2PT o Palla persa. Il descrittore si aggiunge al tag selezionato, per esempio Ottimo, Buono o Negativo. I giocatori sono descrittori: quando ne premi uno, la clip entra tra quelle di quel giocatore e la vedi nella sua scheda dentro l\'app (la vedono staff e ospiti). I giocatori di Perugia sono bianchi se si gioca in casa e blu in trasferta, quelli dell\'altra squadra sono gialli.</p>\n' +
      '<p>Ogni pulsante premuto fa un breve lampo di luce, anche quando viene premuto in automatico da un collegamento.</p>\n' +
      '<h3>Pulsanti automatici ed esiti</h3>\n' +
      '<p>Alcuni pulsanti ne premono altri da soli. 1c1 preme anche 1c1 difesa per l\'avversario e ti chiede se vuoi dare un descrittore anche alla difesa. Rimbalzo attacco preme Tag Up (Ottimo) per la stessa squadra e Tagliafuori (Negativo) per l\'avversaria. P&R Handler preme anche 1c1, con lo stesso descrittore, e 1c1 difesa. Post basso preme Post basso difesa. Le coppie attacco e difesa (contenimento e drop, in terza, lo show, cucù, il cambio, fondo) si premono a vicenda per l\'avversario: se uno riceve Ottimo, l\'altro diventa Negativo, e il contrario. Il Buono non viene copiato.</p>\n' +
      '<p>L\'esito (Ottimo, Buono, Negativo) è uno solo per ogni schema o P&R: se ne ha già uno non ne riceve un altro. Gli schemi (Gioco 1-8, rimesse, zone) possono prenderlo da soli: nelle impostazioni dello schema scegli le regole, per esempio se entro 20 secondi premi 2PT lo schema diventa Ottimo, se premi 2PT Sbagliato diventa Negativo.</p>\n' +
      '<p>Il fallo va in automatico alla squadra in difesa, a meno che tu non selezioni un giocatore in attacco: a quel punto passa all\'attacco. Nelle impostazioni di ogni pulsante c\'è la sezione Collegamenti automatici, dove crei i tuoi: scegli il pulsante da premere, la squadra e il descrittore, che può essere copiato, specchiato (Ottimo diventa Negativo) o chiesto ogni volta.</p>\n' +
      '<h3>Modificare la tua finestra</h3>\n' +
      '<p>Modifica ti permette di sistemare tutti i pulsanti dove vuoi: li trascini con il dito o con il mouse e li ridimensioni con la maniglia in basso a destra. Per spostarne più di uno insieme, trascina con la freccia sullo sfondo per fare un rettangolo di selezione (con Maiusc aggiungi o togli un pulsante dalla selezione) e poi trascina uno dei selezionati.</p>\n' +
      '<p>Toccando un pulsante apri le sue impostazioni: nome, comportamento (categoria o descrittore), forma, grandezza, colore, tasto, secondi di clip prima e dopo, gruppo (Schema, Difesa o nessuno), regole di esito e collegamenti automatici. Un pulsante del gruppo Difesa crea il tag per la squadra della tabella non selezionata. Nello stesso gruppo di descrittori se ne sceglie uno solo. Duplica copia un pulsante, la x lo elimina o toglie un giocatore dalla partita, + Pulsante ne aggiunge uno nuovo. Fine salva tutto, Annulla torna com\'era. Sullo sfondo c\'è un campo da basket, solo per orientarti.</p>\n' +
      '<h3>Una tabella per squadra</h3>\n' +
      '<p>Il pulsante con il nome della squadra e Tab passa alla tabella e ai giocatori dell\'altra squadra (scorciatoia: il tasto Tab, o il tasto < vicino a Maiusc). L\'ultima tabella salvata è quella ufficiale: tutte le squadre usano gli stessi pulsanti nelle stesse posizioni, cambiano solo i giocatori. Se la modifichi, la nuova disposizione diventa quella di tutte.</p>\n' +
      '<p>Ogni volta che passi da una squadra all\'altra, con Tab o con il pulsante sullo schermo (quindi anche su iPad), il possesso viene contato alla squadra di cui apri la tabella. Con le coppie attacco e difesa (contenimento e drop, in terza, show, cucù, cambio, fondo) ti chiede prima l\'avversario, poi scegli il giocatore della squadra in tab. Le domande restano sullo schermo 3 secondi. Il + accanto ai descrittori di un tag serve ad aggiungere una descrizione dimenticata. Quando premi Fallo ti chiede se segnare il giocatore in difesa. Quando premi un P&R, in attacco o in difesa, ti chiede il difensore, e l\'attaccante che tocchi dopo si lega allo stesso P&R. L\'elenco dei tag ha in cima il più recente. Il pulsante Rimbalzo avv. dà il rimbalzo alla squadra che difende, ti chiede se attribuirlo a un giocatore e passa alla sua tabella. Il cambio avviene da solo dopo un rimbalzo in difesa, dopo una palla persa e dopo un tiro da 2 o 3 segnato, appena scegli il giocatore: se poi il tiro risulta sbagliato, la tabella e il possesso tornano com\'erano. Maiusc resta per aggiungere un possesso a mano e non si somma se l\'hai appena contato.</p>\n' +
      '<p>Sotto i pulsanti, il tasto con il nome della squadra serve ad aggiungere giocatori: vedi quelli non selezionati e puoi inserirne uno che non è nel database. Se un giocatore cambia numero di maglia nelle statistiche FIP Stats, il numero si aggiorna da solo ovunque. Gli schemi taggati vanno da soli nel profilo della squadra, con il nome scritto nella barra sopra il pulsante.</p>\n' +
      '<h3>Tagging Under</h3>\n' +
      '<p>Aperto dalla sezione Under, il tagging mostra le partite del gruppo. Carica partita chiede le due squadre, la giornata e il video; il link di YouTube o Facebook è facoltativo, e se c\'è basta anche solo quello: la partita si apre subito e il video si aggiunge dopo dall\'elenco con Aggiungi video, che lo carica su Drive e nella playlist YouTube senza perdere i tag.</p>\n' +
      '<p>La tavola parte dalla Finestra under predefinita: i 12 giocatori del gruppo sono già in campo, senza quintetto e senza cambi, e il pulsante + serve a metterne uno al posto di un altro. Il pulsante Auto parte spento. Gli avversari si chiamano Giocatore 1, Giocatore 2 e così via: con Nomi avversari scrivi i nomi veri, e quelli cambiati formano il roster avversario nelle statistiche di fine partita. Nel tagging Under le finestre nuove e le tabelle di squadra non si possono salvare.</p>\n' +
      '<h3>Finestre salvate</h3>\n' +
      '<p>Il pulsante Finestre salva la disposizione attuale con un nome e la ricarica quando serve, anche su un\'altra partita. Salvare con un nome già usato aggiorna quella finestra. Le finestre si possono esportare in un file e importare, per passarle a chi non le vede.</p>\n' +
      '<h3>Tabelloni: punti, tiri e possessi</h3>\n' +
      '<p>In alto a destra sul video c\'è il tabellone. Il primo riquadro somma i punti di ogni squadra a ogni tiro da 1, 2 o 3 (un tiro sbagliato non conta) e ha il meno e il più per correggere. Il secondo conta i tiri tentati, cioè 1PT, 2PT e 3PT segnati e sbagliati, e i possessi.</p>\n' +
      '<p>Per contare un possesso premi Maiusc da solo: il possesso va alla squadra della tabella aperta. Se premi Maiusc insieme a un altro tasto non conta. Toccando il numero dei possessi ne togli uno, se ti sei sbagliato.</p>\n' +
      '<p>La piccola icona sopra il tabellone lo nasconde e lo rimostra, e la maniglia accanto la usi per spostarlo dove ti è più comodo. Ogni volta che apri il tagging il tabellone torna in alto a destra.</p>\n' +
      '<h3>Il tag selezionato</h3>\n' +
      '<p>Toccando un tag nell\'elenco si apre, sotto di lui, una tendina con Rivedi, Esporta mp4, la nota e il cestino, e una barra con due maniglie: trascina quella di sinistra per cambiare l\'inizio e quella di destra per cambiare la fine. Sotto il tag puoi anche cambiare la squadra a cui è riferito. Il cestino elimina subito il tag, ma lo ritrovi nel pulsante cestino accanto a Finestre e Modifica e lo ripristini per 14 giorni. Esporta mp4 registra la clip mentre scorre e la salva sul tuo computer: serve il video aperto da file e un browser Chrome o Edge recente, altrimenti il file è webm.</p>\n' +
      '<h3>Statistiche</h3>\n' +
      '<p>L\'icona delle statistiche mostra i numeri della partita, con tre viste: Tutte, Tagging e FIP Stats. Nel Tagging trovi i grafici dei tag, le tabelle per categoria con i descrittori e, per ogni giocatore, quante volte è stato taggato in ogni categoria. In FIP Stats, se la partita è nei dati, trovi parziali e tabellino di entrambe le squadre.</p>\n' +
      '<p>In alto puoi esportare tutto: Esporta come PDF salva la schermata, Scarica Excel crea il foglio con riepilogo, tag e giocatori, e Carica come dati vari manda il foglio nell\'app, nella scheda della partita. I dati si leggono così: ogni numero è un conteggio di tag, e i tag con esito Ottimo, Buono e Negativo dicono come è andata. Per le statistiche di una squadra su più partite (quanti P&R gioca, in che modo difende, quanti schemi usa) conta la somma dei tag di tutte le sue partite.</p>\n' +
      '<h3>Analisi partita e liste video</h3>\n' +
      '<p>La tappa Analizza, in alto, apre una schermata a due parti. A sinistra, in una colonna stretta, i grafici: tag per categoria, quando sono avvenuti, chi ha più tag e i descrittori più usati; in alto scegli Tutte, Tagging o FIP Stats. A destra, in grande, il video, i filtri per categoria, giocatore e descrittore e l\'elenco dei tag.</p>\n' +
      '<p>Toccando una riga la clip parte nel video, e con Clip precedente e Clip successiva scorri quelle filtrate. Il pulsante + a sinistra di ogni riga la aggiunge alla lista in costruzione (diventa un segno di spunta, premilo ancora per toglierla). Crea lista video ti chiede se è per la squadra o per un giocatore: dai un nome e salva. Puoi fare tutte le liste che vuoi, e ognuna si può riprodurre, esportare in un unico video, modificare o eliminare. Esporta CSV scarica l\'elenco dei tag filtrati.</p>\n' +
      '<p>Nel popup di una lista trascini le clip con i puntini per cambiare l\'ordine. Sotto il video c\'è la barra del tempo: trascini le maniglie gialle per allungare o accorciare la clip, o la parte colorata per spostarla. La gomma di ogni clip toglie i suoi disegni, l\'icona con i due quadrati la copia in un\'altra lista. Aggiungi clip da un\'altra lista unisce anche clip di altre partite (il video deve essere su Drive). Crea video registra le clip in un file unico che salvi sul computer o carichi su Drive, e l\'app chiede cosa caricare (playbook avversario, video partita, post partita, dati vari). Presentazione fa scorrere le clip con le frecce.</p>\n' +
      '<h3>Tagga, Analizza, Presenta</h3>\n' +
      '<p>In alto ci sono sempre tre tappe. Tagga è la schermata di lavoro con il video e i pulsanti. Analizza apre la matrice, le statistiche, i filtri e l\'elenco dei tag. Presenta raccoglie le liste video, controlla la durata e porta la clip alla squadra o nell\'esportazione.</p>\n' +
      '<p>La matrice ha le categorie nelle righe e i descrittori nelle colonne: ogni numero dice quante clip hanno quella combinazione. Tocca un numero per vedere subito quelle clip (per esempio i rimbalzi difensivi con descrittore Negativo), il nome di una riga per tutte le clip di quella categoria, il nome di una colonna per tutte quelle con quel descrittore. Con Durata al posto di Numero vedi i secondi delle clip, non i conteggi. La matrice segue i filtri di squadra e di giocatore. In Statistiche, Durata delle clip somma i secondi per categoria e per descrittore: non è il tempo vero di gioco, dipende dai secondi prima e dopo di ogni pulsante.</p>\n' +
      '<p>Confronta clip, sopra l\'elenco dei tag, fa spuntare da 2 a 4 clip e le affianca nello stesso schermo: partono insieme e puoi fermarle, rallentarle e farle ripetere. Serve il video aperto da file o da Drive.</p>\n' +
      '<p>In una lista ogni clip ha la spunta Nel video e la velocità. Spenta, la clip resta in lista ma non va in presentazione né nel video esportato, così accorci senza perdere nulla. Con la velocità 0,5x quella clip passa al rallentatore. In alto si vede la durata totale, che diventa rossa sopra gli 8 minuti, il tempo consigliato per una riunione. Consiglio: una lista chiamata Video finale con solo le clip da mostrare.</p>\n' +
      '<p>Presenta, accanto a ogni lista, apre la presentazione a schermo intero. Solo video (tasto S) nasconde tutto tranne il video, adatto alla squadra. Copione a parte apre una seconda finestra con l\'elenco delle clip, le note e i pulsanti per scorrere, fermare e cambiare velocità: porta la prima finestra sul proiettore e tieni il copione sul tuo schermo. In Presenta scegli anche il logo della società sul video, un file per ogni clip (utile per mandare le clip ai singoli giocatori) e il file dei capitoli, un testo con il minuto di inizio di ogni clip.</p>\n' +
      '<p>Clip rapida (pulsante sotto il video, oppure premi e rilascia il tasto Ctrl) crea al volo una clip con una nota, anche se non hai un pulsante per quell\'azione. La velocità del video scelta con il menu resta uguale anche dopo una pausa o un cambio di clip, e le misure delle finestre si ricordano per ogni utente.</p>\n' +
      '<p>Nelle statistiche, il riquadro Numeri per possesso mostra punti per possesso, tiro effettivo, palle perse ogni 100 possessi e altro per le due squadre. I possessi si possono prendere dal tabellone (quelli che conti con Tab o Maiusc) oppure dalla formula tiri + 0,45 liberi + palle perse - rimbalzi offensivi: i due conteggi possono differire e c\'è l\'interruttore per scegliere. Nell\'editor della lista, Slide con numeri inserisce dopo la clip una diapositiva con 2 o 3 di questi numeri, che si vede anche nel video esportato.</p>\n' +
      '<h3>Lavorare in più persone</h3>\n' +
      '<p>Le partite, i tag, le liste video e le finestre salvate sono comuni a tutto lo staff. Nell\'elenco delle partite vedi chi ci ha lavorato e chi è stato l\'ultimo, con giorno e ora. Un pallino verde mostra chi sta lavorando in quel momento sulla stessa partita.</p>\n' +
      '<h3>Salvataggio automatico</h3>\n' +
      '<p>Ogni tag si salva da solo subito dopo averlo fatto. Se chiudi l\'app a metà, alla riapertura trovi l\'ultima partita dal minuto in cui eri e i tag non ancora salvati vengono recuperati. Premendo Partite si torna all\'elenco.</p>\n' +
      '<h3>Scorciatoie</h3>\n' +
      '<p>Pulsante x2 sotto il video: raddoppia la velocità, premuto di nuovo torna normale. Tasto x2 (di partenza è L): finché lo tieni premuto il video va al doppio, quando lo lasci torna com\'era. Per scegliere un altro tasto tocca il pulsante Tasto x2 e premi quello che vuoi; Backspace lo disattiva. Il tasto scelto vale al posto di un eventuale pulsante che aveva la stessa lettera. Barra spaziatrice: play e pausa. Frecce sinistra e destra: 5 secondi indietro o avanti. Frecce su e giù: 10 secondi avanti o indietro. Il pulsante Frecce, sotto il video, cambia questi secondi. Il tasto assegnato a una categoria crea il tag. Maiusc da solo aggiunge un possesso. Tab cambia tabella.</p>\n' +
      '<p style="margin-top:14px;opacity:.7"><a href="https://tagup.it/" target="_blank" rel="noopener" style="color:inherit;font-weight:800">Tagup&trade;</a> tagup.it &middot; 2026</p>' +
      '</div></div>';
    $('hX').onclick = function () { m.classList.add('hid'); };
  }
  document.addEventListener('keydown', tasto, true); document.addEventListener('keyup', x2Su, true); document.addEventListener('keydown', tastoShift, true); document.addEventListener('keyup', tastoShift, true); document.addEventListener('keydown', tastoAltro, true); document.addEventListener('keydown', possessoShift, true); document.addEventListener('keyup', possessoShift, true); document.addEventListener('mousedown', function () { shiftSolo = false; }, true);
  document.addEventListener('keydown', ctrlGiu, true); document.addEventListener('keyup', ctrlSu, true); document.addEventListener('mousedown', function () { ctrlSolo = false; }, true);
  window.addEventListener('blur', function () { mostraTasti(false); ctrlSolo = false; });
  window.addEventListener('pagehide', ricordaUltimo);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { ricordaUltimo(); if (tags.some(function (t) { return t._s; })) salvaCoda(); } });
  window.addEventListener('beforeunload', function (e) { if (tags.some(function (t) { return t._s; })) { e.preventDefault(); e.returnValue = ''; } });
  /* X in alto a destra su ogni finestra: preme il pulsante di chiusura della finestra (Chiudi, Annulla, Torna...) o, se non c'e, la nasconde */
  (function () {
    var md = document.getElementById('modal'); if (!md || !window.MutationObserver) return;
    function metti() {
      if (md.classList.contains('hid')) return;
      var box = md.firstElementChild; if (!box || box.querySelector('.mxx') || box.querySelector('#stX')) return;
      if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'mxx'; b.setAttribute('aria-label', 'Chiudi'); b.innerHTML = '&times;';
      b.onclick = function (ev) {
        ev.stopPropagation();
        var c = box.querySelector('#edC,#stX') || [].filter.call(box.querySelectorAll('button'), function (q) { return q !== b && !q.disabled && /^\s*(chiudi|annulla|torna|esci|fine|no)\b/i.test(q.textContent || ''); })[0];
        if (c) c.click(); else md.classList.add('hid');
      };
      box.insertBefore(b, box.firstChild);
    }
    new MutationObserver(metti).observe(md, { childList: true, attributes: true, attributeFilter: ['class'] });
  })();
