:root{--bg:#0b0d10;--deep:#232B36;--txt:#F4F1EA;--muted:rgba(244,241,234,.64);--line:rgba(244,241,234,.16);--yel:#FBFF12;--red:#FF2929;--card:rgba(35,43,54,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Tagup Text",system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--deep);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-family:"Tagup Display",sans-serif;font-size:17px;margin:0 8px 0 0;letter-spacing:.02em;text-transform:uppercase}
header h1 span{color:var(--yel)}
.sp{flex:1}
.b{background:transparent;border:1px solid var(--line);border-radius:3px;padding:9px 13px;min-height:44px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--txt)}
.b:active{transform:scale(.96)}
.b.p{background:var(--yel);color:#111;border-color:var(--yel)}
#stato{font-size:12px;color:var(--muted)}#stato.err{color:var(--red)}
main{padding:12px}
.msg{max-width:560px;margin:60px auto;padding:20px;text-align:center;line-height:1.5}
.lav{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:14px;align-items:start}
video{width:100%;max-height:58vh;background:#000;border-radius:4px;display:block}
.seek{margin:10px 0 0}.seek input{width:100%;height:30px;accent-color:var(--yel);margin:0}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;align-items:center}
.ctl select{background:var(--deep);border:1px solid var(--line);border-radius:3px;padding:10px;font-size:14px}
#ora{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.t{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.gioc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gioc button{min-height:46px;border-radius:999px;border:1px solid var(--line);background:rgba(35,43,54,.8);cursor:pointer;font-weight:700;font-size:13px;padding:6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gioc button.on{background:var(--yel);color:#111;border-color:var(--yel)}
.gioc button.avv{border-style:dashed}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.az button{min-height:54px;border-radius:4px;border:0;cursor:pointer;font-weight:800;font-size:14px;color:#fff;padding:6px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.az button:active{transform:scale(.94)}
.es{display:flex;gap:6px}.es button{flex:1;min-height:46px;border-radius:999px;border:0;cursor:pointer;font-weight:800;color:#111}
.lista{max-height:34vh;overflow:auto}
.riga{display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.riga b{min-width:46px;font-variant-numeric:tabular-nums}.riga span{flex:1}
.riga button{background:none;border:1px solid var(--line);border-radius:3px;color:var(--muted);min-width:40px;min-height:36px;cursor:pointer}
.vl{display:grid;gap:8px}
.vi{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:rgba(35,43,54,.5)}
.vi:hover{border-color:var(--yel)}
.vi small{display:block;color:var(--muted);margin-top:2px}
@media (max-width:900px){.lav{display:block}}
.riga button.ex{color:var(--txt);min-width:64px;font-size:12px;font-weight:700}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.mod>div{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.mod h2{margin:0 0 10px;font-size:18px}
.mod select,.mod input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:11px;font-size:14px;margin:6px 0}
.mod .fl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mute{color:var(--muted);font-size:13px}
.hid{display:none!important}

/* --- Tagup: stile unico con l'app --- */
:root{--deep:#0f1318;--card:rgba(15,19,24,.78);--line:rgba(244,241,234,.14);--ink:#0b0d10}

header{background:#0b0d10;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}

.card{border:1px solid var(--line);background:var(--card);border-top:2px solid var(--yel)}

.vi b{font-family:"Tagup Cond","Tagup Display",sans-serif;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
label.f{font-family:"Tagup Cond",sans-serif;font-size:13px}
input:focus-visible,select:focus-visible,textarea:focus-visible,.b:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.modal>div{background:#0f1318;border:1px solid var(--line);border-top:3px solid var(--yel)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}::-webkit-scrollbar-track{background:transparent}

    $('bX2').onclick = velX2;

    disegnaBoard();
    filtri = { g: '', a: '' };
    $('fg').innerHTML = '<option value="">Tutti i giocatori</option>' + nomiGioc().concat(['Avversario']).map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
    $('fa').innerHTML = '<option value="">Tutte le azioni</option>' + PULSANTI.map(function (p) { return '<option>' + esc(p.n) + '</option>'; }).join('');

  }

  /* ---------- tavola ---------- */

  function tagga(cat) {

      };
    });
  }

  /* ---------- esportazione clip (mp4) e cartelle della squadra ---------- */
  var exp = false, PRE = 8, POST = 4;
  function mimeExport() {

  /* il video di Drive si puo registrare solo se aperto in modalita CORS (serve la chiave): altrimenti si apre dal computer */
  function preparaVideo(cb) {
    if (video.fonteLocale || vEl.crossOrigin === 'anonymous') return cb(true);
    if (!video.url || video.url === '#' || DEMO) return cb(true);
    if (!DRIVE_KEY) return cb(false, 'Per esportare le clip apri la partita dal computer: usa il pulsante "Apri dal computer" e scegli lo stesso file.');
    var t = vEl.currentTime || 0;
    stato('Preparo il video per l\'esportazione...');
    vEl.crossOrigin = 'anonymous'; vEl.src = urlDrive(video.id, 0); vEl.load();
    var fatto = false, tm = setTimeout(function () { fine(vEl.readyState > 0); }, 30000);
    function fine(okk) { if (fatto) return; fatto = true; clearTimeout(tm); vEl.removeEventListener('loadedmetadata', su); if (okk) { try { vEl.currentTime = t; } catch (e) {} cb(true); } else cb(false, 'Il video di Drive non si lascia registrare. Aprilo dal computer con il pulsante "Apri dal computer".'); }

  }
  function esporta(lista, nome) {

    var mime = mimeExport(); if (!mime) { stato('Questo browser non sa esportare i video: usa Chrome o Edge.', true); return; }

    lista.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (t) {
      var c = { inizio: Math.max(0, t.t - PRE), fine: Math.min(dur, t.t + POST) }, u = clip[clip.length - 1];
      if (u && c.inizio <= u.fine) u.fine = Math.max(u.fine, c.fine); else clip.push(c);
    });
    preparaVideo(function (okp, msg) {
      if (!okp) { modale('<h2>Non posso esportare</h2><div>' + esc(msg) + '</div><div class="fl"><button class="b p" id="mOk">Ho capito</button></div>'); $('mOk').onclick = chiudiModale; return; }
      registra(clip, nome, mime);
    });
  }
  function registra(clip, nome, mime) {
    var ext = /mp4/.test(mime) ? 'mp4' : 'webm', rec = null, chunks = [], i = 0, annulla = false, errore = '', timer = null, chiuso = false, muto0 = vEl.muted, vel = vEl.playbackRate;
    exp = true;
    function msg(t) {
      var pc = Math.round(Math.min(i, clip.length) / clip.length * 100);
      modale('<h2>Sto creando il video</h2><div style="font-weight:700">' + esc(t) + '</div><div style="height:16px;background:var(--bg);border-radius:8px;overflow:hidden;margin:12px 0 4px"><i id="exBar" style="display:block;height:100%;width:' + pc + '%;background:var(--yel)"></i></div><div id="exPct" style="font-size:22px;font-weight:700">' + pc + '%</div>' +
        '<div class="mute" style="margin:10px 0">Il video si registra mentre le clip scorrono: ci vuole quanto dura la lista. Non toccare il video e non chiudere la pagina.' + (ext === 'webm' ? ' Questo browser salva in formato webm.' : '') + '</div><div class="fl"><button class="b" id="exA">Annulla</button></div>');
      $('exA').onclick = function () { annulla = true; };
    }
    function avanza(c) {
      var b = $('exBar'), t = $('exPct'); if (!b) return;
      var fr = Math.max(0, Math.min(1, (vEl.currentTime - c.inizio) / Math.max(0.1, c.fine - c.inizio))), pc = Math.min(99, Math.round((i + fr) / clip.length * 100));
      b.style.width = pc + '%'; t.textContent = pc + '%';
    }
    function chiudi() {
      if (chiuso) return; chiuso = true; exp = false;

      if (annulla) { chiudiModale(); stato('Esportazione annullata'); return; }
      if (errore || blob.size <= 2000) { modale('<h2>Video non creato</h2><div>' + esc(errore || 'La registrazione è rimasta vuota: apri la partita dal computer e riprova.') + '</div><div class="fl"><button class="b p" id="mOk">Ho capito</button></div>'); $('mOk').onclick = chiudiModale; return; }
      dopoVideo(blob, nomeFile(video.nome || 'partita') + '-' + nomeFile(nome) + '.' + ext, (video.a && video.b ? video.a + ' vs ' + video.b : 'Partita') + ' - ' + nome);

    }
    function clipVia(c) {
      var fatto = false; msg('Clip ' + (i + 1) + ' di ' + clip.length);
      function via() {
        if (fatto) return; fatto = true; vEl.removeEventListener('seeked', via);
        try {
          if (!rec) {
            var stm = vEl.captureStream ? vEl.captureStream() : vEl.mozCaptureStream();

  function scaricaBlob(blob, fname) {

    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  /* a video creato: lo salvo nel computer oppure lo metto in una cartella della squadra (esistente o nuova) */
  function dopoVideo(blob, fname, titolo) {
    var cart = dati.cartelle || [], sceltaC = cart.length ? cart[0].id : '__nuova';
    function schermata(err) {
      modale('<h2>Video pronto</h2><div>' + esc(titolo) + ' (' + (Math.round(blob.size / 104857.6) / 10) + ' MB)</div>' +
        '<div class="fl"><button class="b" id="dvPc">Salva nel mio computer</button></div>' +
        '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)"><b>Vuoi inserirlo in una cartella della squadra?</b><div class="mute">Le cartelle le vede tutto il gruppo.</div>' +
        '<select id="dvC">' + cart.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === sceltaC ? ' selected' : '') + '>' + esc(c.nome) + '</option>'; }).join('') + '<option value="__nuova"' + (sceltaC === '__nuova' ? ' selected' : '') + '>+ Crea una nuova cartella</option></select>' +
        '<input type="text" id="dvN" maxlength="50" placeholder="Nome della nuova cartella" class="' + (sceltaC === '__nuova' ? '' : 'hid') + '">' +
        '<div class="fl"><button class="b p" id="dvGo">Metti nella cartella</button></div></div>' +
        '<div id="dvE" class="mute" style="color:var(--red);min-height:18px;margin-top:6px">' + esc(err || '') + '</div><div class="fl"><button class="b" id="dvNo">Chiudi</button></div>');

      $('dvNo').onclick = chiudiModale;
      $('dvC').onchange = function () { sceltaC = this.value; $('dvN').classList.toggle('hid', sceltaC !== '__nuova'); };

        var id = $('dvC').value, nuovo = String(($('dvN') || {}).value || '').trim();

          api('under_cartella_salva', { nome: nuovo }).then(function (r) {
            if (!r || !r.ok) { schermata((r && r.errore) || 'Non riesco a creare la cartella.'); return; }
            if (!cart.some(function (c) { return c.id === r.id; })) cart.push({ id: r.id, nome: r.nome });
            dati.cartelle = cart; sceltaC = r.id; invia(r.id, r.nome);

    }
    function invia(cartellaId, nomeCart) {
      var file = new File([blob], fname, { type: blob.type }), par = { cat: 'cartella', cartellaId: cartellaId, titolo: titolo, nomeFile: file.name, mime: file.type || 'video/mp4', size: file.size };
      function prog(p) { var b = $('upB'), t = $('upP'); if (b) { b.style.width = p + '%'; t.textContent = p + '%'; } }

      api('under_carica_inizia', par).then(function (r) {
        if (!r || !r.ok) return schermata((r && r.errore) || 'Non riesco ad avviare il caricamento.');
        (DEMO ? Promise.resolve('demo') : inviaPezzi(file, r.url, prog)).then(function (id) {

          $('dvFine').onclick = chiudiModale;
        }, function (m) { schermata(typeof m === 'string' ? m : 'Caricamento interrotto.'); });

  }
  document.addEventListener('keyup', function (e) { if (window.__x2) window.__x2.su(e); });
  document.addEventListener('keydown', function (e) {
