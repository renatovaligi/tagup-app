:root{--bg:#0b0d10;--deep:#0b121b;--card:rgba(15,26,39,.66);--txt:#f4f1ea;--muted:#9aa5b3;--line:rgba(244,241,234,.16);--red:#ff5a1f;--redt:#ff9a6b;--yel:#e8d9a8;--ok:#7bd36b;--fluo:#7bd36b;--warn:#ffb347;--bad:#d9534f;--teal:#3fb8af;--glw:rgba(255,90,31,.35);--display:"Tagup Display","Arial Black",Impact,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--txt);font:15px/1.45 "Tagup Text",system-ui,sans-serif;min-height:100vh;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(rgba(244,241,234,.09) 1.4px,transparent 1.6px) 0 0/48px 48px,var(--bg)}
#glow{position:fixed;left:0;top:0;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.24) 0%,rgba(255,90,31,.09) 40%,rgba(255,90,31,0) 68%);pointer-events:none;z-index:-1;will-change:transform}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 0 20px}
header img{height:32px;display:block}
header .tit{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin-right:auto;line-height:1.1}
header .tit small{display:block;font:700 11px "Tagup Text";letter-spacing:.24em;color:var(--muted);margin-top:4px}
.bts{display:flex;gap:8px;flex-wrap:wrap}
.bt{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.bt:hover{border-color:var(--red);color:var(--redt)}
.bt.p{background:var(--red);border-color:var(--red);color:#fff}.bt.p:hover{color:#fff;filter:brightness(1.08)}
.pie{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
.pie .cr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.pie .cr img{height:16px}.pie .cr a{color:var(--txt);font-weight:800;text-decoration:none}
.pie .so{display:flex;gap:8px;margin-left:auto}
.pie .so a{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--txt)}
.pie .so a:hover{border-color:var(--red);color:var(--redt)}
.hint{color:var(--muted);font-size:12px;margin:0 0 16px}
#board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:stretch}
.it{position:relative;grid-column:span 6;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s,border-color .15s}
.it.w3{grid-column:span 3}.it.w4{grid-column:span 4}.it.w6{grid-column:span 6}.it.w8{grid-column:span 8}.it.w12{grid-column:span 12}
.it.drag{z-index:20;box-shadow:0 18px 50px rgba(0,0,0,.5);border-color:var(--red);opacity:.96;cursor:grabbing;transition:none}
.it.kpi{padding:16px 16px 14px;gap:6px}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:.35;transition:opacity .15s}
.it:hover .tools,.it.drag .tools{opacity:1}
@media(hover:none){.tools{opacity:.7}}
.tl{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;padding:0;color:var(--muted)}
.tl:hover{border-color:var(--line);color:var(--txt)}
.tl svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grip{cursor:grab;touch-action:none}
.ct{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding-right:64px}
.ct::before{content:"";width:3px;height:14px;background:var(--red);flex:none}
.sub{color:var(--muted);font-size:12px;margin-top:-6px}
.kv{font-family:var(--display);font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.kv.al{color:var(--red)}.kv.gr{color:var(--fluo);text-shadow:0 0 14px rgba(123,211,107,.35)}
.kl{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.kn{color:var(--muted);font-size:12px}
.vuoto{color:var(--muted);font-size:13px;padding:14px 0}
svg text{font-family:"Tagup Text",sans-serif}
.spk{width:100%;height:34px;display:block;margin-top:2px}
.barre{display:flex;flex-direction:column;gap:10px}
.br{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.br .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .t{height:10px;background:rgba(244,241,234,.08);border-radius:999px;overflow:hidden}
.br .t i{display:block;height:100%;background:linear-gradient(90deg,#b8430f,var(--red));border-radius:999px}
.br .v{font-variant-numeric:tabular-nums;color:var(--muted);min-width:34px;text-align:right}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg b{color:var(--txt);font-variant-numeric:tabular-nums}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:rgba(244,241,234,.08)}
.stack i{display:block;height:100%}
.lg{position:relative;flex:none;width:46px;height:46px;border-radius:10px;background:rgba(244,241,234,.08);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--muted);overflow:hidden}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff1;padding:4px}
.lg.s{width:34px;height:34px;border-radius:8px;font-size:14px}
.sh{display:flex;gap:12px;align-items:center;padding-right:64px}
.sh h4{margin:0;font-family:var(--display);font-size:18px;text-transform:uppercase;line-height:1.15}
.cmp{color:var(--muted);font-size:12px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--fluo);border-color:rgba(123,211,107,.5);background:rgba(123,211,107,.08)}.chip.warn{color:var(--warn);border-color:var(--warn)}.chip.bad{color:var(--bad);border-color:var(--bad)}
.sbody{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px}.ring svg{width:96px;height:96px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:rgba(244,241,234,.05);border-radius:8px;padding:10px}
.mini b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.mini span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.riga{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.riga span:first-child{color:var(--muted)}.riga b{text-align:right;font-variant-numeric:tabular-nums}
.sc h5,.h5{margin:0 0 8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.att{font-size:13px;color:var(--muted);line-height:1.6}.att b{color:var(--txt)}
.tip{position:fixed;z-index:50;background:#0b0f14;border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:12px;pointer-events:none;display:none;white-space:nowrap}
.nota{color:var(--muted);font-size:12px;line-height:1.55;margin-top:28px;max-width:760px}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
.login img{height:34px;margin-bottom:18px}
.login h1{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0 0 6px}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.login input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;color:inherit;padding:11px 14px;font:inherit;font-size:16px;margin-bottom:10px}
.login input:focus{outline:2px solid var(--red);outline-offset:0}
.err{color:var(--bad);font-size:13px;margin:4px 0 10px;min-height:18px}
.carico{color:var(--muted);text-align:center;padding:60px 0}
.it{box-shadow:0 10px 36px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04)}
.it:hover{border-color:rgba(255,90,31,.42);box-shadow:0 0 30px rgba(255,90,31,.14),0 10px 36px rgba(0,0,0,.38)}
.kv.al{text-shadow:0 0 20px rgba(255,90,31,.6)}.kv.gr{text-shadow:0 0 20px rgba(123,211,107,.5)}.kv{text-shadow:0 0 16px rgba(244,241,234,.12)}
.ct::before{box-shadow:0 0 10px rgba(255,90,31,.9)}
.gg polyline{filter:drop-shadow(0 0 5px rgba(255,90,31,.65))}.gg circle{filter:drop-shadow(0 0 4px rgba(255,90,31,.8))}
.gc rect[fill="#ff5a1f"]{filter:drop-shadow(0 0 7px rgba(255,90,31,.75))}
.br .t i{box-shadow:0 0 10px rgba(255,90,31,.55)}
.ring svg circle:nth-child(2){filter:drop-shadow(0 0 6px currentColor)}
.donut svg circle{filter:drop-shadow(0 0 4px rgba(255,255,255,.12))}
.spk polyline{filter:drop-shadow(0 0 4px rgba(255,90,31,.6))}
.chip.ok{box-shadow:0 0 12px rgba(123,211,107,.25)}.chip.warn{box-shadow:0 0 12px rgba(255,179,71,.22)}.chip.bad{box-shadow:0 0 12px rgba(217,83,79,.25)}
.bt.p{box-shadow:0 0 22px rgba(255,90,31,.4)}
.stack i{box-shadow:0 0 10px currentColor}
.azs{display:flex;flex-wrap:wrap;gap:6px}
.ab{background:rgba(244,241,234,.05);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txt)}
.ab:hover{border-color:var(--red);color:var(--redt);box-shadow:0 0 14px rgba(255,90,31,.25)}
.ab.bad:hover{border-color:var(--bad);color:var(--bad);box-shadow:0 0 14px rgba(217,83,79,.25)}
.md{position:fixed;inset:0;z-index:60;background:rgba(3,5,8,.72);backdrop-filter:blur(4px);display:flex;padding:16px;overflow:auto}
.md[hidden],.toast[hidden]{display:none}
.mb{width:100%;max-width:480px;margin:auto;background:#0e1621;border:1px solid rgba(255,90,31,.35);border-radius:14px;padding:22px;box-shadow:0 0 50px rgba(255,90,31,.18),0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.mb>*{flex-shrink:0}.mb.mlg{max-width:620px}
.mb h3{margin:0;font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1.15}
.mb p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.mb label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mb input,.mb select,.mb textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;color:inherit;padding:10px 12px;font:inherit;font-size:15px;color-scheme:dark}
.mb input:focus,.mb select:focus,.mb textarea:focus{outline:2px solid var(--red);outline-offset:0}
.mb select option{background:#0e1621}
.mr{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mr .bt{padding:9px 16px}
.cod{font-family:var(--display);font-size:22px;letter-spacing:.06em;text-align:center;padding:14px;border:1px dashed rgba(255,90,31,.5);border-radius:10px;background:rgba(255,90,31,.07);text-shadow:0 0 16px rgba(255,90,31,.5);overflow-wrap:anywhere}
.ur{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ur:first-child{border-top:0}
.ur b{display:block;font-size:14px}.ur small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.ur .ac{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ur select{width:auto;padding:6px 8px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:#0e1621;border:1px solid rgba(255,90,31,.5);border-radius:999px;padding:10px 18px;font-size:13px;box-shadow:0 0 30px rgba(255,90,31,.25);max-width:92vw;text-align:center}
.toast.er{border-color:var(--bad);box-shadow:0 0 30px rgba(217,83,79,.25)}
.chip.at{color:var(--warn);border-color:var(--warn)}
@media(max-width:820px){.it.w3,.it.w4{grid-column:span 6}.it.w6,.it.w8,.it.w12{grid-column:span 12}.sbtn{display:none}}
@media(max-width:480px){.it.w3,.it.w4{grid-column:span 6}.kv{font-size:30px}.sbody{grid-template-columns:1fr}}

/* ===== Identita Tagup: nero neutro, campo da basket, luce arancione ===== */
:root{--bg:#0b0d10;--deep:#12151a;--card:rgba(18,21,26,.72);--display:"Tagup Display","Arial Black",Impact,sans-serif;--acc:var(--red);--acg:255,90,31;--ink:#0b0d10;--cut:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
body::before{content:none}#glow{display:none}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--mx:72%;--my:28%;--acc:rgb(var(--acg))}
#fx .base,#fx .lit{position:absolute;inset:0}#fx svg{position:absolute;inset:0;width:100%;height:100%}
#fx .cp{display:none}#fx .cl{display:block}
@media (orientation:portrait){#fx .cp{display:block}#fx .cl{display:none}}
#fx .base path,#fx .base circle,#fx .base rect,#fx .base line{fill:none;stroke:rgba(243,243,241,.10);stroke-width:1.6;vector-effect:non-scaling-stroke}
#fx .lit{-webkit-mask-image:radial-gradient(340px circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:radial-gradient(340px circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.55) 45%,transparent 100%)}
#fx .lit path,#fx .lit circle,#fx .lit rect,#fx .lit line{fill:none;stroke:var(--acc);stroke-opacity:.55;stroke-width:2;vector-effect:non-scaling-stroke}
#fx .glow{position:absolute;inset:0;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(var(--acg),.13),transparent 70%)}
#app{position:relative;z-index:1}
@media (max-width:700px){#fx .lit{-webkit-mask-image:radial-gradient(220px circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:radial-gradient(220px circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.55) 45%,transparent 100%)}}
.wrap{position:relative;z-index:1}
header .tit{font-size:30px;letter-spacing:.03em}
.sezt{display:flex;gap:0;margin:0 0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.sezt::-webkit-scrollbar{display:none}
.sz{flex:1 1 0;min-width:120px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);font:400 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:14px 16px;min-height:48px;cursor:pointer}
.sz:hover{color:var(--txt,#f3f3f1)}.sz.on{color:var(--redt,#ff5a1f);border-bottom-color:var(--red,#ff5a1f)}.sz:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.tb{overflow-x:auto}.tb table{width:100%;border-collapse:collapse;font-size:13px}.tb th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 8px;border-bottom:1px solid var(--line)}.tb td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sc-in{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:12px 0}.sc-in input{width:100%;min-width:0;box-sizing:border-box}.sc-in+.azs{display:flex;flex-wrap:wrap;gap:8px}.sc-in label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.sc-in input{min-height:44px;background:transparent;border:1px solid var(--line);color:inherit;padding:8px;font:inherit;font-size:16px;border-radius:0}
header .tit small{font:600 14px "Tagup Text";letter-spacing:.01em;text-transform:none}
.bt{border-radius:0;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em;padding:10px 18px;min-height:44px}
.bt.p{color:var(--ink);clip-path:var(--cut)}
.it{border-radius:0;border:0;border-top:2px solid var(--line);background:var(--card)}
.pie .so a,.tl{border-radius:0}
.ct{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.03em}
.ct::before{content:none}
.kl{text-transform:none;letter-spacing:.01em;font-size:13px;font-weight:600}
.kv{font-size:44px}.kv.gr{text-shadow:none}
*{text-shadow:none!important}
.br .t{border-radius:0}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
/* avvio sala controllo */
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;overflow:hidden}
#boot.on{display:grid}
#boot svg{width:min(60vmin,440px);height:auto;overflow:visible;margin-top:-10vh}
#boot .r{fill:none;stroke:var(--red);stroke-width:1.5;transform-origin:200px 200px}
#boot .r1{stroke-dasharray:1131;stroke-dashoffset:1131;animation:draw2 1.2s .1s ease-out forwards,spin 14s linear infinite}
#boot .r2{stroke-dasharray:6 10;opacity:.7;animation:spinr 18s linear infinite;stroke-width:2}
#boot .r3{stroke-dasharray:460;stroke-dashoffset:460;animation:draw2 1s .5s ease-out forwards;stroke-width:3}
#boot .r4{stroke:var(--line);stroke-dasharray:2 6}
#boot .r5{stroke-dasharray:70 730;animation:spin 5s linear infinite;stroke-width:3}
#boot .tk{stroke:var(--red);stroke-width:2;opacity:0;animation:fadein .4s .9s forwards}
#boot .cr{stroke:var(--line);stroke-width:1;fill:none}
#boot .lg{fill:none}

    if (az === 'rinnova') { var S = soc(nome); apri('<h3>Rinnova licenza</h3><p>' + esc(S.nome) + '. Scadenza attuale: ' + (S.scadenza ? fmtData(S.scadenza) : 'nessuna') + '. Il rinnovo parte dalla scadenza se è futura, altrimenti da oggi, e riattiva la società.</p><div class="mr" style="justify-content:flex-start"><button class="bt" data-az="rin" data-s="' + esc(nome) + '" data-m="6">+ 6 mesi</button><button class="bt p" data-az="rin" data-s="' + esc(nome) + '" data-m="12">+ 12 mesi</button><button class="bt" data-az="rin" data-s="' + esc(nome) + '" data-m="24">+ 24 mesi</button></div><div><label for="rd">Oppure imposta la data</label><input id="rd" type="date" value="' + esc(S.scadenza || '') + '"></div><div class="mr"><button class="bt" data-az="chiudi">Annulla</button><button class="bt" data-az="rdata" data-s="' + esc(nome) + '" data-nessuna="1">Senza scadenza</button><button class="bt p" data-az="rdata" data-s="' + esc(nome) + '">Salva data</button></div>'); return; }
    if (az === 'rin') return agisci('dash_soc', { op: 'rinnova', societa: nome, mesi: Number(t.getAttribute('data-m')) }).then(function (r) { dopo(r, 'Licenza rinnovata fino al ' + fmtData(r.scadenza)); });
    if (az === 'rdata') { var dv = t.getAttribute('data-nessuna') ? '' : ((document.getElementById('rd') || {}).value || ''); if (!dv && !t.getAttribute('data-nessuna')) return avviso('Scegli una data', 1); return agisci('dash_soc', { op: 'scadenza', societa: nome, scadenza: dv }).then(function (r) { dopo(r, dv ? 'Scadenza impostata al ' + fmtData(dv) : 'Licenza senza scadenza'); }); }
    if (az === 'stato') { var on = t.getAttribute('data-on') === '1'; return on ? conferma('Sospendere ' + esc(soc(nome).nome) + '?', 'Gli utenti della società non potranno più entrare finché non la riattivi. I dati restano al loro posto.', 'stato-ok', 'data-s="' + esc(nome) + '" data-on="0"', 'Sospendi') : agisci('dash_soc', { op: 'stato', societa: nome, attiva: true }).then(function (r) { dopo(r, 'Società riattivata'); }); }
    if (az === 'stato-ok') return agisci('dash_soc', { op: 'stato', societa: nome, attiva: false }).then(function (r) { dopo(r, 'Società sospesa'); });
    if (az === 'utenti') return listaUtenti(nome);
    if (az === 'uatt') { var onu = t.getAttribute('data-on') === '1'; t.disabled = true; return agisci('dash_utente', { email: t.getAttribute('data-e'), attivo: onu }).then(function (r) { dopo(r, onu ? 'Utente attivo' : 'Utente disattivato', nome, true); }); }
    if (az === 'nuova') { apri('<h3>Nuova società</h3><p>Crea la società e un codice licenza. Poi potrai inviare il codice per email.</p><div><label for="ns">Nome della società</label><input id="ns" maxlength="80" placeholder="Es. Basket Esempio ASD"></div><div><label for="nv">Nome da mostrare nell\'app (facoltativo)</label><input id="nv" maxlength="60"></div><div><label for="nq">Squadre, separate da punto e virgola (facoltativo)</label><input id="nq" maxlength="200" placeholder="Serie C; Under 17"></div><div><label for="nd">Scadenza licenza (facoltativa)</label><input id="nd" type="date"></div><div class="mr"><button class="bt" data-az="chiudi">Annulla</button><button class="bt p" data-az="nuova-ok">Crea società</button></div>'); return; }
    if (az === 'nuova-ok') { var nm = (document.getElementById('ns') || {}).value || ''; if (nm.trim().length < 3) return avviso('Scrivi il nome della società', 1); t.disabled = true; return agisci('dash_soc', { op: 'nuova', societa: nm.trim(), nomeVisibile: (document.getElementById('nv') || {}).value || '', squadre: (document.getElementById('nq') || {}).value || '', scadenza: (document.getElementById('nd') || {}).value || '' }).then(function (r) { t.disabled = false; if (!r.ok) return avviso(r.errore || 'Creazione non riuscita.', 1); avviso('Società creata'); mostraCodice(nm.trim(), r.codice); carica(); }); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t || t.getAttribute('data-az-ch') !== 'ruolo') return;
    agisci('dash_utente', { email: t.getAttribute('data-e'), ruolo: t.value }).then(function (r) { if (!r.ok) avviso(r.errore || 'Non riuscito.', 1); else avviso('Utenza aggiornata'); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !md.hidden) chiudi(); });

  /* ---------- alone arancione che segue il mouse ---------- */
  (function () {
    var g = document.getElementById('glow'), tx = window.innerWidth * .88, ty = 110, cx = tx, cy = ty, ferma = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    function pos() { g.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px)'; }
    pos(); if (ferma) return;
    window.addEventListener('pointermove', function (e) { tx = e.clientX; ty = e.clientY; }, { passive: true });
    window.addEventListener('resize', function () { if (tx > window.innerWidth) tx = window.innerWidth * .88; });
    (function giro() { cx += (tx - cx) * .07; cy += (ty - cy) * .07; pos(); requestAnimationFrame(giro); })();
  })();

  /* ---------- pagina ---------- */
  var IC_GRIP = '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/></svg>';
  var IC_SIZE = '<svg viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>';
  function head() { return '<header><img src="logo-tagup-bianco.svg" alt="Tagup"><div class="tit">Dashboard<small>Utilizzo dell\'app e società</small></div><div class="bts"><a class="bt p" href="https://app.tagup.it/" style="text-decoration:none">Vai all\'app</a><a class="bt" href="https://tagup.it/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Vai al sito</a>' + (D ? '<button class="bt" data-az="nuova">Nuova società</button><button class="bt" id="bRes" title="Riporta i riquadri alla disposizione iniziale">Ripristina layout</button>' : '') + '<button class="bt" id="bAgg">Aggiorna</button><button class="bt" id="bEsc">Esci</button></div></header>' + (D ? '<nav class="sezt" role="tablist" aria-label="Sezioni">' + Object.keys(SEZ_NOMI).map(function (k) { return '<button type="button" role="tab" class="sz' + (k === SEZ ? ' on' : '') + '" aria-selected="' + (k === SEZ) + '" data-sez="' + k + '">' + SEZ_NOMI[k] + '</button>'; }).join('') + '</nav>' : ''); }
  function pie() { return '<div class="pie"><span class="cr"><img src="logo-tagup-bianco.svg" alt=""><a href="https://tagup.it" target="_blank" rel="noopener">Tagup&trade;</a><span>tagup.it &middot; 2026</span></span><div class="so" role="group" aria-label="Seguici sui social">' + SOCIAL_TAGUP.map(function (x) { return '<a href="' + x.u + '" target="_blank" rel="noopener" aria-label="' + x.n + '" title="' + x.n + '">' + x.i + '</a>'; }).join('') + '</div></div>'; }
  function bindHead() {
    var a = document.getElementById('bAgg'), e = document.getElementById('bEsc'), r = document.getElementById('bRes');
    if (a) a.onclick = carica; if (e) e.onclick = esci;
    if (r) r.onclick = function () { LAY = { order: [], w: {} }; salvaLay(); disegna(); };
  }
  function disegna() {
    if (stato === 'carico' && !D) { app.innerHTML = head() + '<div class="carico">Carico i dati...</div>' + pie(); bindHead(); return; }
    if (!D) { app.innerHTML = head() + '<div class="vuoto">' + esc(errore || 'Nessun dato.') + '</div>' + pie(); bindHead(); return; }
    var L = riquadri().filter(function (x) { return x.sez === SEZ; }), pos = {}; LAY.order.forEach(function (id, i) { pos[id] = i; });
    L.forEach(function (x, i) { x._o = pos[x.id] !== undefined ? pos[x.id] : 1000 + i; }); L.sort(function (a, b) { return a._o - b._o; });
    var h = head() + '<p class="hint" id="hintSez">Trascina i riquadri dall\'icona con i puntini per spostarli, usa la freccia per cambiare la larghezza. La disposizione resta salvata su questo dispositivo.</p><div id="board">' + L.map(function (x) {
      var w = LAY.w[x.id]; if (x.ws.indexOf(w) < 0) w = x.w;
      return '<section class="it w' + w + (x.k ? ' kpi' : '') + '" data-id="' + esc(x.id) + '" data-ws="' + x.ws.join(',') + '"><div class="tools"><button class="tl sbtn" data-sz title="Cambia larghezza" aria-label="Cambia larghezza">' + IC_SIZE + '</button><button class="tl grip" title="Trascina per spostare" aria-label="Sposta il riquadro">' + IC_GRIP + '</button></div>' +
        (x.t ? '<div class="ct">' + x.t + '</div>' + (x.s ? '<div class="sub">' + x.s + '</div>' : '') : '') + x.h + '</section>';
    }).join('') + '</div>' +
      '<p class="nota">Dati aggregati: la dashboard non mostra mai statistiche di singoli atleti, che restano di proprietà della società. Gli accessi arrivano dal registro dell\'app (si conservano le ultime settimane), le sezioni aperte da quando gli utenti hanno l\'ultima versione. Aggiornato il ' + fmtData(D.generato) + '.</p>' + pie();;
    app.innerHTML = h; bindHead(); bindTip(); bindBoard();
  }
  function bindTip() {
    function mostra(ev) {
      var p = ev.touches ? ev.touches[0] : ev, el = ev.target.closest ? ev.target.closest('.hit,.hc') : null; if (!el) return nascondi();
      if (el.classList.contains('hit')) { var x = D.giorni[Number(el.getAttribute('data-i'))]; tip.innerHTML = '<b>' + fmtData(x.d) + '</b><br>' + fmtN(x.v) + ' accessi &middot; ' + fmtN(x.u) + ' utenti diversi'; }
      else tip.innerHTML = esc(el.getAttribute('data-t'));
      tip.style.display = 'block'; tip.style.left = Math.max(4, Math.min(window.innerWidth - tip.offsetWidth - 8, p.clientX + 12)) + 'px'; tip.style.top = (p.clientY - 54) + 'px';
    }
    function nascondi() { tip.style.display = 'none'; }
    var b = document.getElementById('board'); if (!b) return;
    b.addEventListener('mousemove', mostra); b.addEventListener('mouseleave', nascondi); b.addEventListener('touchstart', mostra, { passive: true }); b.addEventListener('touchend', function () { setTimeout(nascondi, 1500); });
  }
  function bindBoard() {
    var b = document.getElementById('board'); if (!b) return;
    function salvaOrdine() { var vis = Array.prototype.map.call(b.querySelectorAll('.it'), function (x) { return x.getAttribute('data-id'); }); LAY.order = vis.concat((LAY.order || []).filter(function (id) { return vis.indexOf(id) < 0; })); salvaLay(); }
    b.addEventListener('click', function (e) {
      var s = e.target.closest('[data-sz]'); if (!s) return;
      var it = s.closest('.it'), ws = it.getAttribute('data-ws').split(',').map(Number), cur = ws.filter(function (w) { return it.classList.contains('w' + w); })[0] || ws[0];
      var nx = ws[(ws.indexOf(cur) + 1) % ws.length]; ws.forEach(function (w) { it.classList.remove('w' + w); }); it.classList.add('w' + nx);
      LAY.w[it.getAttribute('data-id')] = nx; salvaOrdine();
    });
    b.addEventListener('pointerdown', function (e) {
      var gr = e.target.closest('.grip'); if (!gr || (e.button && e.button !== 0)) return;
      var it = gr.closest('.it'); e.preventDefault();
      var r0 = it.getBoundingClientRect(), ox = e.clientX - r0.left, oy = e.clientY - r0.top, ux = e.clientX, uy = e.clientY, timer = null;
      it.classList.add('drag'); try { gr.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
      function muovi() {
        it.style.transform = 'none'; var base = it.getBoundingClientRect();
        it.style.transform = 'translate(' + (ux - ox - base.left) + 'px,' + (uy - oy - base.top) + 'px)';
        it.style.pointerEvents = 'none'; var el = document.elementFromPoint(ux, uy); it.style.pointerEvents = '';
        var t = el && el.closest ? el.closest('.it') : null;
        if (t && t !== it && t.parentNode === b) {
          var tr = t.getBoundingClientRect(), stessaRiga = base.top < tr.bottom && base.bottom > tr.top, dopo = !!(it.compareDocumentPosition(t) & 4);
          var sup = stessaRiga ? (dopo ? ux > tr.left + tr.width / 2 : ux < tr.left + tr.width / 2) : (dopo ? uy > tr.top + tr.height / 2 : uy < tr.top + tr.height / 2);
          if (sup) { b.insertBefore(it, dopo ? t.nextSibling : t); it.style.transform = 'none'; var nb = it.getBoundingClientRect(); it.style.transform = 'translate(' + (ux - ox - nb.left) + 'px,' + (uy - oy - nb.top) + 'px)'; }
        }
      }
      function mv(ev) { ux = ev.clientX; uy = ev.clientY; muovi(); }
      function fine() {
        clearInterval(timer); it.classList.remove('drag'); it.style.transform = '';
        gr.removeEventListener('pointermove', mv); gr.removeEventListener('pointerup', fine); gr.removeEventListener('pointercancel', fine);
        salvaOrdine();
      }
      gr.addEventListener('pointermove', mv); gr.addEventListener('pointerup', fine); gr.addEventListener('pointercancel', fine);
      timer = setInterval(function () { if (uy < 90) { window.scrollBy(0, -14); muovi(); } else if (uy > window.innerHeight - 90) { window.scrollBy(0, 14); muovi(); } }, 16);
      muovi();
    });
  }
  if (tok) carica(); else vistaLogin();
})();
